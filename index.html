<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>元素大對決</title>
<!--
  元素大對決：元素卡牌比大小，玩著玩著記住週期表的趨勢
  - 單一 HTML 檔，完全離線可用，不引用任何外部資源
  - 卡牌與圖示皆為原創設計
  - 數值：原子量（IUPAC 標準原子量，取到小數點後 2 位）、鮑林電負度、
    共價半徑（Cordero et al., 2008）、第一游離能、室溫密度
-->
<style>
:root{
  --bg:#0f4c4a; --bg2:#0b3b3a; --felt:#11605c; --ink:#1d2326; --cream:#fff8ea; --soft:#6b7276;
  --gold:#ffcf4a; --a:#ff6b5b; --b:#4aa3ff; --good:#2fbf71;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  color:#fff; font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.08), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 8px),
    var(--bg);
  background-attachment:fixed;
  user-select:none; -webkit-user-select:none;
}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
[hidden]{display:none !important}
#app{max-width:1000px; margin:0 auto; padding:14px 14px 28px}
.screen{display:none} .screen.active{display:block}
.btn{border-radius:12px; padding:10px 18px; font-weight:900; background:var(--gold); color:#3b2a00; box-shadow:0 4px 0 #b88c12}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #b88c12}
.btn.ghost{background:rgba(255,255,255,.12); color:#fff; box-shadow:none}
.btn.small{font-size:14px; padding:6px 12px}

/* ---------- 首頁 ---------- */
.home{max-width:560px; margin:0 auto; text-align:center}
.home h1{font-size:clamp(38px,11vw,58px); margin:10px 0 0; letter-spacing:4px; color:var(--gold); text-shadow:0 4px 0 #0a2e2d}
.home .sub{margin:4px 0 0; font-weight:700; opacity:.85}
.fan{display:flex; justify-content:center; margin:18px 0 8px; height:160px; overflow:hidden; padding-top:6px}
.fan .fc{width:78px; margin:0 -8px; flex:none; transform-origin:50% 100%}
.fan .card .mini, .fan .card svg{width:100%}
.opts{background:rgba(0,0,0,.2); border-radius:18px; padding:16px; text-align:left; display:grid; grid-template-columns:minmax(0,1fr); gap:14px}
.opt h3{margin:0 0 8px; font-size:15px; opacity:.8}
.seg{display:flex; gap:8px; flex-wrap:wrap}
.seg button{flex:1; min-width:90px; padding:10px; border-radius:12px; background:rgba(255,255,255,.1); font-weight:800}
.seg button.on{background:#fff; color:var(--ink)}
.names{display:flex; gap:8px}
.names input{flex:1; min-width:0; font:inherit; font-weight:800; padding:9px 12px; border-radius:10px; border:2px solid transparent; background:rgba(255,255,255,.95); color:var(--ink)}
.names input:focus{outline:none; border-color:var(--gold)}
.names .ia{border-left:6px solid var(--a)} .names .ib{border-left:6px solid var(--b)}
.start{width:100%; font-size:24px; padding:14px; margin-top:16px}
.rules{text-align:left; font-size:14px; line-height:1.8; opacity:.85; margin:14px 4px 0; padding-left:18px}
.home-foot{display:flex; justify-content:center; gap:10px; margin-top:12px}

/* ---------- 卡牌 ---------- */
.card{background:var(--cream); color:var(--ink); border-radius:16px; padding:8px; box-shadow:0 8px 18px rgba(0,0,0,.35); border:4px solid var(--cc); position:relative; overflow:hidden}
.card .top{display:flex; align-items:flex-start; gap:6px; background:var(--cc); margin:-8px -8px 6px; padding:8px 10px 6px; color:#fff}
.card .z{font-weight:900; font-size:13px; opacity:.9}
.card .sym{font-size:clamp(34px,9vw,46px); font-weight:900; line-height:1; letter-spacing:-1px; margin-left:auto; text-shadow:0 2px 0 rgba(0,0,0,.2)}
.card .nm{font-weight:900; font-size:clamp(15px,4vw,19px); line-height:1.15}
.card .en{font-size:11px; opacity:.85}
.card .cat{font-size:11px; font-weight:800; background:rgba(0,0,0,.18); border-radius:999px; padding:1px 7px; display:inline-block; margin-top:3px}
.card .zrow{font-weight:800; font-size:14px; margin-bottom:4px}
.card .zrow b{font-size:22px; margin-left:4px}
.card .mini{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--soft); font-weight:800; margin-bottom:6px; text-align:center}
.card .mini svg{width:100%; height:auto}
.stats{display:grid; gap:4px}
.stat{display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:9px; background:#f1e7d1; font-size:13px; text-align:left; width:100%}
.stat .l{font-weight:800}
.stat .v{margin-left:auto; font-weight:900; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap}
.stat .v small{font-size:11px; font-weight:700; color:var(--soft)}
.stat.tie{background:var(--gold)}
.card.pickable .stat{cursor:pointer}
.card.pickable .stat:hover{background:#ffe7a3}
.stat.chosen{background:var(--gold)}
.stat.win{background:#c4f2d6; box-shadow:inset 0 0 0 2px var(--good)}
.stat.lose{background:#f3d6d2}
.card.back{background:repeating-linear-gradient(135deg, #1b6f6a 0 10px, #17625e 10px 20px); border-color:#e9dcc0; display:flex; align-items:center; justify-content:center}
.card.back .logo{width:70%; aspect-ratio:1; border-radius:50%; border:4px solid rgba(255,255,255,.6); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:28px; color:rgba(255,255,255,.85); text-align:center; line-height:1.1}
.flip{animation:flip .45s ease-out}
@keyframes flip{0%{transform:rotateY(90deg)} 100%{transform:rotateY(0)}}
.won{box-shadow:0 0 0 4px var(--gold), 0 0 26px rgba(255,207,74,.75)}

/* ---------- 對戰桌 ---------- */
.score{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.pl{flex:1; display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.22); border-radius:14px; padding:8px 12px; border-bottom:4px solid transparent; min-width:0}
.pl.a{border-color:var(--a)} .pl.b{border-color:var(--b); flex-direction:row-reverse; text-align:right}
.pl .n{font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl .c{margin-left:auto; font-weight:900; font-size:22px; font-variant-numeric:tabular-nums}
.pl.b .c{margin-left:0; margin-right:auto}
.pl .c small{font-size:12px; opacity:.7; margin-left:2px}
.pl.turn{background:rgba(255,255,255,.16)}
.mid{text-align:center; font-weight:800; font-size:13px; opacity:.85; white-space:nowrap}
.banner{text-align:center; font-weight:900; font-size:clamp(17px,4.6vw,21px); margin:4px 0 10px; min-height:28px}
.banner .ta{color:#ffb3a9} .banner .tb{color:#a9d4ff}
.table{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:start; max-width:720px; margin:0 auto}
.slot{min-height:300px}
.slot .card{width:100%}
.vs{align-self:center; font-weight:900; font-size:26px; color:var(--gold); text-shadow:0 3px 0 #0a2e2d}
.pot{text-align:center; font-size:13px; opacity:.85; margin-top:4px}
.explain{max-width:720px; margin:12px auto 0; background:var(--cream); color:var(--ink); border-radius:14px; padding:12px 14px; line-height:1.7; font-size:15px}
.explain:empty{display:none}
.explain b{font-size:17px}
.explain .tr{color:#0f6e68; font-weight:800}
.next{display:block; margin:12px auto 0; font-size:20px; padding:12px 30px}
.quit{float:right}

/* ---------- 結果 ---------- */
.result{max-width:520px; margin:20px auto 0; text-align:center; background:rgba(0,0,0,.22); border-radius:20px; padding:22px 18px}
.result h2{font-size:clamp(30px,8vw,40px); margin:6px 0; color:var(--gold)}
.result .line{font-size:18px; font-weight:800}
.result .learn{text-align:left; background:var(--cream); color:var(--ink); border-radius:14px; padding:12px 14px; margin-top:14px; font-size:14px; line-height:1.8}
.result .learn h4{margin:0 0 4px; font-size:15px}
.r-btns{display:flex; gap:10px; margin-top:16px}
.r-btns .btn{flex:1; font-size:18px}

@media (max-width:560px){
  .table{grid-template-columns:1fr 1fr; gap:8px}
  .vs{display:none}
  .card{padding:6px; border-width:3px}
  .card .top{margin:-6px -6px 5px; padding:6px 7px 5px}
  .stat .v small{display:none}
  .stat{padding:5px 6px; font-size:12px; flex-wrap:wrap; gap:0 4px}
  .stat .v{font-size:14px}
  .slot{min-height:260px}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen active">
    <div class="home">
      <h1>元素大對決</h1>
      <p class="sub">選一個項目比大小，贏走對手的元素卡！</p>
      <div class="fan" id="fan"></div>
      <div class="opts">
        <div class="opt"><h3>對手</h3><div class="seg" id="modeSeg">
          <button data-v="cpu">挑戰電腦</button><button data-v="pvp">兩人對戰（同一台）</button>
        </div></div>
        <div class="opt"><h3>名字</h3><div class="names">
          <input class="ia" id="nameA" maxlength="8" placeholder="紅隊">
          <input class="ib" id="nameB" maxlength="8" placeholder="藍隊">
        </div></div>
        <div class="opt"><h3>回合數</h3><div class="seg" id="roundSeg">
          <button data-v="10">10 回合</button><button data-v="20">20 回合</button><button data-v="0">收完所有卡</button>
        </div></div>
      </div>
      <button class="btn start" id="startBtn">開始對決！</button>
      <ol class="rules">
        <li>22 張元素卡平分給兩邊，每回合各出最上面的一張。</li>
        <li>卡上只有原子序和週期表位置。輪到的人看自己的卡，想想週期表的趨勢，選一個覺得會贏的項目，<b>比較大的贏</b>，贏家拿走兩張卡。</li>
        <li>贏的人下一回合繼續選。如果兩張卡一個在左上、一個在右下，只看位置判斷不出來，就算<b>平手</b>；平手時兩張卡先放中間，下一回合的贏家一起拿走。</li>
        <li>回合結束時卡比較多的人獲勝；或是一方的卡被收光就結束。</li>
      </ol>
      <div class="home-foot"><button class="btn ghost small" id="soundBtn"></button></div>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="score">
      <div class="pl a" id="plA"><span class="n" id="nA"></span><span class="c" id="cA"></span></div>
      <div class="mid" id="roundInfo"></div>
      <div class="pl b" id="plB"><span class="n" id="nB"></span><span class="c" id="cB"></span></div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="table">
      <div class="slot" id="slotA"></div>
      <div class="vs">VS</div>
      <div class="slot" id="slotB"></div>
    </div>
    <div class="pot" id="pot"></div>
    <div class="explain" id="explain"></div>
    <button class="btn next" id="nextBtn" hidden></button>
    <div style="margin-top:14px"><button class="btn ghost small quit" id="quitBtn">結束對戰</button></div>
  </section>

  <section id="result" class="screen"><div class="result" id="resultBox"></div></section>
</div>

<script>
/* =====================================================================
   元素資料
   m 原子量；en 鮑林電負度（稀有氣體沒有，null）；r 共價半徑 pm（Cordero 2008）；
   ie 第一游離能 kJ/mol；d 室溫密度 g/cm³；p 週期；g 族；st 室溫狀態
   ===================================================================== */
const CATS = {
  alkali:{ n:'鹼金屬', c:'#e8553f' }, alkaline:{ n:'鹼土金屬', c:'#f08c2a' },
  metal:{ n:'其他金屬', c:'#6b7fa3' }, metalloid:{ n:'類金屬', c:'#2aa58a' }, nonmetal:{ n:'非金屬', c:'#3cae4a' },
  halogen:{ n:'鹵素', c:'#a35bd6' }, noble:{ n:'稀有氣體', c:'#d64f9c' }
};
const E = [
  ['H','氫','Hydrogen',1,'nonmetal',1.01,2.20,31,1312,0.00009,1,1,'g'],
  ['He','氦','Helium',2,'noble',4.00,null,28,2372,0.00018,1,18,'g'],
  ['Li','鋰','Lithium',3,'alkali',6.94,0.98,128,520,0.534,2,1,'s'],
  ['Be','鈹','Beryllium',4,'alkaline',9.01,1.57,96,899,1.85,2,2,'s'],
  ['B','硼','Boron',5,'metalloid',10.81,2.04,84,801,2.34,2,13,'s'],
  ['C','碳','Carbon',6,'nonmetal',12.01,2.55,76,1086,2.27,2,14,'s'],
  ['N','氮','Nitrogen',7,'nonmetal',14.01,3.04,71,1402,0.00125,2,15,'g'],
  ['O','氧','Oxygen',8,'nonmetal',16.00,3.44,66,1314,0.00143,2,16,'g'],
  ['F','氟','Fluorine',9,'halogen',19.00,3.98,57,1681,0.0017,2,17,'g'],
  ['Ne','氖','Neon',10,'noble',20.18,null,58,2081,0.0009,2,18,'g'],
  ['Na','鈉','Sodium',11,'alkali',22.99,0.93,166,496,0.97,3,1,'s'],
  ['Mg','鎂','Magnesium',12,'alkaline',24.31,1.31,141,738,1.74,3,2,'s'],
  ['Al','鋁','Aluminium',13,'metal',26.98,1.61,121,578,2.70,3,13,'s'],
  ['Si','矽','Silicon',14,'metalloid',28.09,1.90,111,787,2.33,3,14,'s'],
  ['P','磷','Phosphorus',15,'nonmetal',30.97,2.19,107,1012,1.82,3,15,'s'],
  ['S','硫','Sulfur',16,'nonmetal',32.06,2.58,105,1000,2.07,3,16,'s'],
  ['Cl','氯','Chlorine',17,'halogen',35.45,3.16,102,1251,0.0032,3,17,'g'],
  ['Ar','氬','Argon',18,'noble',39.95,null,106,1521,0.0018,3,18,'g'],
  ['K','鉀','Potassium',19,'alkali',39.10,0.82,203,419,0.89,4,1,'s'],
  ['Ca','鈣','Calcium',20,'alkaline',40.08,1.00,176,590,1.55,4,2,'s'],
  ['Br','溴','Bromine',35,'halogen',79.90,2.96,120,1140,3.10,4,17,'l'],
  ['I','碘','Iodine',53,'halogen',126.90,2.66,139,1008,4.93,5,17,'s']
].map(function(a){ return { s:a[0], n:a[1], en_n:a[2], z:a[3], k:a[4], m:a[5], en:a[6], r:a[7], ie:a[8], d:a[9], p:a[10], g:a[11], st:a[12] }; });
const BY = {}; E.forEach(function(e){ BY[e.s] = e; });

const STATS = [
  { k:'m',  n:'原子量',   tip:'原子有多重' },
  { k:'r',  n:'原子半徑', tip:'原子有多大' },
  { k:'en', n:'電負度',   tip:'搶電子的能力' },
  { k:'ie', n:'游離能',   tip:'抓住電子的能力' }
];
const TREND = {
  m:'原子量大致跟著原子序增加：原子序越大，原子核裡的質子、中子越多，原子就越重。',
  r:'原子半徑：同一族越往下越大（電子層變多）；同一週期越往右越小（原子核的正電荷變多，把電子拉得更緊）。所以左下角的原子最大。',
  en:'電負度是原子吸引電子的能力：同一週期越往右越大、同一族越往上越大，所以右上角的氟最大。稀有氣體幾乎不形成化學鍵，沒有電負度。',
  ie:'游離能是拿走一個電子需要的能量：同一週期越往右越大、同一族越往上越大。稀有氣體的電子最穩定，最難拿走。'
};

/* ===== 小工具 ===== */
const $ = function(id){ return document.getElementById(id); };
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('active', s.id===id); }); window.scrollTo(0,0); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
const store = (function(){
  try{ const s = JSON.parse(localStorage.getItem('element-duel')); if(s) return s; }catch(e){}
  return { mode:'cpu', rounds:'20', nameA:'', nameB:'' };
})();
function save(){ try{ localStorage.setItem('element-duel', JSON.stringify(store)); }catch(e){} }

/* ===== 音效 ===== */
let ac = null, soundOn = true;
function tone(freqs, dur, type, gap){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(function(fq,i){
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*(gap||dur);
      o.type = type||'sine'; o.frequency.value = fq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}
function sFlip(){ tone([500,700], 0.06, 'triangle'); }
function sWin(){ tone([523,659,784], 0.1, 'triangle'); }
function sLose(){ tone([330,262], 0.14, 'triangle'); }
function sTie(){ tone([440,440], 0.1, 'sine', 0.14); }

/* =====================================================================
   卡牌畫面
   ===================================================================== */
/* 迷你週期表（前 6 週期，不含鑭系、錒系） */
function miniPT(e){
  const W = 6, H = 6;
  let s = '<svg viewBox="0 0 '+(18*W+2)+' '+(6*H+2)+'" aria-hidden="true">';
  for(let p=1;p<=6;p++) for(let g=1;g<=18;g++){
    if(p===1 && g>1 && g<18) continue;
    if((p===2 || p===3) && g>2 && g<13) continue;
    const on = e.p===p && e.g===g;
    s += '<rect x="'+(1+(g-1)*W)+'" y="'+(1+(p-1)*H)+'" width="'+(W-1)+'" height="'+(H-1)+'" rx="1" fill="'+(on ? CATS[e.k].c : '#d9ccb0')+'"'+(on?' stroke="#1d2326" stroke-width="1"':'')+'/>';
  }
  return s + '</svg>';
}
const STATE = { g:'氣體', l:'液體', s:'固體' };
function cardHTML(e, opt){
  opt = opt || {};
  return '<div class="card'+(opt.pick?' pickable':'')+(opt.cls?' '+opt.cls:'')+'" style="--cc:'+CATS[e.k].c+'">'
    + '<div class="top"><div><div class="nm">'+e.n+'</div><div class="en">'+e.en_n+'</div><span class="cat">'+CATS[e.k].n+'</span></div><div class="sym">'+e.s+'</div></div>'
    + '<div class="zrow">原子序 <b>'+e.z+'</b></div>'
    + '<div class="mini">'+miniPT(e)+'<span>第 '+e.p+' 週期・第 '+e.g+' 族</span></div>'
    + '<div class="stats">'+STATS.map(function(st){
        let cls = '', tag = '';
        if(opt.res && opt.res.k===st.k){ cls = opt.res.cls; tag = { win:'比較大 ▲', lose:'比較小 ▼', tie:'平手 ＝' }[opt.res.cls] || ''; }
        return '<button class="stat '+cls+'" data-k="'+st.k+'"'+(opt.pick?'':' tabindex="-1"')+'><span class="l">'+st.n+'</span><span class="v">'+(tag || '<small>'+st.tip+'</small>')+'</span></button>';
      }).join('')+'</div></div>';
}
function backHTML(){ return '<div class="card back" style="--cc:#e9dcc0; min-height:280px"><div class="logo">元素<br>對決</div></div>'; }

/* 首頁扇形卡 */
(function(){
  const pick = ['Na','C','F','He','K'];
  $('fan').innerHTML = pick.map(function(sym, i){
    const e = BY[sym];
    return '<div class="fc" style="transform:rotate('+((i-2)*9)+'deg) translateY('+(Math.abs(i-2)*8)+'px); z-index:'+(5-Math.abs(i-2))+'">'
      + '<div class="card" style="--cc:'+CATS[e.k].c+'; padding:6px"><div class="top" style="margin:-6px -6px 5px; padding:6px 7px"><div class="nm" style="font-size:14px">'+e.n+'</div><div class="sym" style="font-size:24px">'+sym+'</div></div>'+miniPT(e)+'</div></div>';
  }).join('');
})();

/* ===== 首頁設定 ===== */
function seg(id, key){
  document.querySelectorAll('#'+id+' button').forEach(function(b){
    b.classList.toggle('on', store[key]===b.dataset.v);
    b.onclick = function(){ store[key] = b.dataset.v; save(); renderHome(); };
  });
}
function renderHome(){
  seg('modeSeg','mode'); seg('roundSeg','rounds');
  $('nameA').value = store.nameA || ''; $('nameB').value = store.nameB || '';
  $('nameA').placeholder = store.mode==='cpu' ? '你的名字' : '紅隊';
  $('nameB').placeholder = store.mode==='cpu' ? '電腦' : '藍隊';
  $('nameB').disabled = store.mode==='cpu';
  $('soundBtn').textContent = soundOn ? '🔊 音效開' : '🔇 音效關';
}
$('nameA').oninput = function(){ store.nameA = this.value; save(); };
$('nameB').oninput = function(){ store.nameB = this.value; save(); };
$('soundBtn').onclick = function(){ soundOn = !soundOn; renderHome(); };

/* =====================================================================
   對戰
   ===================================================================== */
let G = null;
function nameOf(side){
  if(side==='A') return (store.nameA || '').trim() || (store.mode==='cpu' ? '你' : '紅隊');
  return store.mode==='cpu' ? '電腦' : ((store.nameB || '').trim() || '藍隊');
}
function startGame(){
  const deck = shuffle(E.slice()), half = deck.length/2;
  G = { A:deck.slice(0,half), B:deck.slice(half), pot:[], turn:Math.random()<.5 ? 'A' : 'B', round:0, max:+store.rounds,
        phase:'pick', last:null, used:{}, wins:{A:0,B:0} };
  if(store.mode==='cpu') G.turn = 'A';
  show('game'); nextRound();
}
function renderScore(){
  $('nA').textContent = nameOf('A'); $('nB').textContent = nameOf('B');
  $('cA').innerHTML = G.A.length+'<small>張</small>'; $('cB').innerHTML = G.B.length+'<small>張</small>';
  $('plA').classList.toggle('turn', G.turn==='A'); $('plB').classList.toggle('turn', G.turn==='B');
  $('roundInfo').textContent = '第 '+G.round+(G.max ? ' / '+G.max : '')+' 回合';
  $('pot').textContent = G.pot.length ? '中間還有 '+G.pot.length+' 張平手的卡，下一回合的贏家一起拿走！' : '';
}
function isCpu(side){ return store.mode==='cpu' && side==='B'; }
function nextRound(){
  if(!G.A.length || !G.B.length || (G.max && G.round >= G.max)){ finish(); return; }
  G.round++; G.phase = 'pick';
  $('explain').innerHTML = ''; $('nextBtn').hidden = true;
  renderScore();
  const me = G.turn, ca = G.A[0], cb = G.B[0];
  const cls = me==='A' ? 'ta' : 'tb';
  if(isCpu(me)){
    $('banner').innerHTML = '<span class="'+cls+'">電腦</span>正在想要比哪一項……';
    $('slotA').innerHTML = backHTML(); $('slotB').innerHTML = cardHTML(cb);
    setTimeout(function(){ choose(cpuPick(cb)); }, 1100);
  }else{
    $('banner').innerHTML = '輪到 <span class="'+cls+'">'+esc(nameOf(me))+'</span>：選一個你覺得會贏的項目！';
    $('slotA').innerHTML = me==='A' ? cardHTML(ca, { pick:true }) : backHTML();
    $('slotB').innerHTML = me==='B' ? cardHTML(cb, { pick:true }) : backHTML();
    document.querySelectorAll('.card.pickable .stat').forEach(function(b){ b.onclick = function(){ choose(b.dataset.k); }; });
  }
}
/* 電腦：選自己這張卡在整副牌裡排名最高的項目，偶爾隨便選 */
function cpuPick(c){
  if(Math.random() < 0.2) return STATS[Math.floor(Math.random()*STATS.length)].k;
  let best = null, bv = -1;
  STATS.forEach(function(st){
    const v = c[st.k] === null ? -1 : c[st.k];
    const rank = E.filter(function(e){ return (e[st.k] === null ? -1 : e[st.k]) < v; }).length / E.length;
    if(rank > bv){ bv = rank; best = st.k; }
  });
  return best;
}
function val(e, k){ return e[k] === null ? -Infinity : e[k]; }
function choose(k){
  if(G.phase !== 'pick') return;
  G.phase = 'reveal'; sFlip();
  const ca = G.A[0], cb = G.B[0], va = val(ca,k), vb = val(cb,k);
  const unclear = isUnclear(ca, cb, k);
  const res = unclear ? 'T' : va > vb ? 'A' : vb > va ? 'B' : 'T';
  G.used[k] = (G.used[k]||0) + 1;
  $('slotA').innerHTML = cardHTML(ca, { cls:'flip'+(res==='A'?' won':''), res:{ k:k, cls:res==='A'?'win':res==='T'?'tie':'lose' } });
  $('slotB').innerHTML = cardHTML(cb, { cls:'flip'+(res==='B'?' won':''), res:{ k:k, cls:res==='B'?'win':res==='T'?'tie':'lose' } });
  const st = STATS.filter(function(s){ return s.k===k; })[0];
  G.A.shift(); G.B.shift();
  if(res === 'T'){
    G.pot.push(ca, cb); sTie();
    $('banner').innerHTML = unclear ? '判斷不出來，算平手！兩張卡先放到中間。' : '平手！兩張卡先放到中間。';
  }else{
    const win = G[res]; win.push(ca, cb); win.push.apply(win, G.pot); G.pot = [];
    G.wins[res]++; G.turn = res;
    const human = store.mode==='pvp' || res==='A';
    (human ? sWin : sLose)();
    $('banner').innerHTML = '<span class="'+(res==='A'?'ta':'tb')+'">'+esc(nameOf(res))+'</span> 贏了這一回合！';
  }
  $('explain').innerHTML = unclear ? unclearHTML(ca, cb, st, va, vb) : explainHTML(ca, cb, st, res);
  renderScore();
  $('nextBtn').textContent = (!G.A.length || !G.B.length || (G.max && G.round >= G.max)) ? '看結果' : '下一回合';
  $('nextBtn').hidden = false;
}
/* 比完之後的說明：只用位置和趨勢說明，不寫數值 */
const IE_EXC = ['Be-B','N-O','Mg-Al','P-S'];
/* 只看位置的預測：'A'、'B'，或 'C'＝兩個趨勢方向相反、判斷不出來 */
function predict(a, b, k){
  const down = Math.sign(a.p - b.p), left = Math.sign(b.g - a.g);
  const sc = k==='r' ? [down, left] : [-down, -left];
  if(sc[0] >= 0 && sc[1] >= 0 && (sc[0] || sc[1])) return 'A';
  if(sc[0] <= 0 && sc[1] <= 0 && (sc[0] || sc[1])) return 'B';
  return 'C';
}
function isUnclear(a, b, k){
  if(k==='m') return false;
  if(k==='en' && (a.en===null || b.en===null)) return false;
  return predict(a, b, k) === 'C';
}
function posWord(a, b){
  const v = a.p < b.p ? '上' : a.p > b.p ? '下' : '', h = a.g < b.g ? '左' : a.g > b.g ? '右' : '';
  return h + v + '方';
}
function unclearHTML(a, b, st, va, vb){
  const k = st.k, W = va > vb ? a : vb > va ? b : null, L = W===a ? b : a;
  const vert = a.p < b.p ? [a, b] : [b, a];          // [上面的, 下面的]
  const hor = a.g < b.g ? [a, b] : [b, a];           // [左邊的, 右邊的]
  const byDown = k==='r' ? vert[1] : vert[0], byLeft = k==='r' ? hor[0] : hor[1];
  return '<b>'+st.n+'：只看位置判斷不出來，這回合算平手！</b><br>'
    + a.n+'和'+b.n+'一個在左上、一個在右下。看上下，'+byDown.n+'的'+st.n+'應該比較大；看左右，卻是'+byLeft.n+'比較大，兩個趨勢方向相反。'
    + (W ? '（偷偷告訴你：實際上是'+W.n+'比較大。）' : '')
    + '<br><span class="tr">趨勢：'+TREND[k]+'</span>';
}
function explainHTML(a, b, st, res){
  const k = st.k, W = res==='A' ? a : res==='B' ? b : null, L = W===a ? b : a;
  let head = (k==='en' && a.en===null && b.en===null) ? '<b>電負度：兩個都沒有電負度，平手！</b>' : W ? '<b>'+st.n+'：'+W.n+'（'+W.s+'）比'+L.n+'（'+L.s+'）大</b>' : '<b>'+st.n+'：'+a.n+'和'+b.n+'一樣大，平手！</b>';
  let why = '';
  if(k==='en' && (a.en===null || b.en===null)){
    why = a.en===null && b.en===null ? '兩個都是稀有氣體，都沒有電負度，所以平手。' : (a.en===null ? a : b).n+'是稀有氣體，沒有電負度，所以一定輸。';
  }else if(k==='m'){
    if((a.s==='Ar' && b.s==='K') || (a.s==='K' && b.s==='Ar')) why = '<b>有名的例外！</b>氬的原子序比鉀小，原子量卻比鉀大，因為氬原子核裡的中子比較多。';
    else why = W.n+'的原子序（'+W.z+'）比'+L.n+'（'+L.z+'）大，所以原子量也比較大。';
  }else if(!W){
    why = '這兩個元素的'+st.n+'剛好差不多一樣大。';
  }else{
    /* 照趨勢預測：半徑左下大；電負度、游離能右上大 */
    const down = Math.sign(a.p - b.p), left = Math.sign(b.g - a.g);
    const score = k==='r' ? [down, left] : [-down, -left];
    let expect = null, conflict = false;
    if(score[0] >= 0 && score[1] >= 0 && (score[0] || score[1])) expect = a;
    else if(score[0] <= 0 && score[1] <= 0 && (score[0] || score[1])) expect = b;
    else conflict = true;
    const where = W.n+'在'+L.n+'的'+posWord(W, L);
    if(conflict){
      why = where+'。一個往上下、一個往左右，兩個趨勢方向相反，只看位置很難判斷；這次是'+W.n+'比較大。';
    }else if(expect === W){
      why = where+'，照趨勢，'+W.n+'的'+st.n+'比較大。';
    }else{
      why = where+'，照趨勢應該是'+L.n+'比較大，<b>但這是例外！</b>';
      if(k==='ie' && a.p===b.p && (IE_EXC.indexOf(a.s+'-'+b.s) >= 0 || IE_EXC.indexOf(b.s+'-'+a.s) >= 0)) why += W.n+'的電子排在填滿或半滿的軌域，比較穩定，所以游離能反而比較大。';
      else if(k==='ie' && L.g===13) why += L.n+'最外層只有一個 p 電子，離原子核比較遠，特別容易被拿走，所以游離能比預期小。';
      else if(k==='ie' && L.g===16) why += L.n+'的 p 軌域裡有一對電子擠在一起、互相排斥，比較容易拿走一個，所以游離能比預期小。';
      else if(a.k==='noble' || b.k==='noble') why += '稀有氣體的原子半徑是另外估計的，不完全照這個趨勢。';
      else why += '這兩個元素不完全照這個趨勢。';
    }
  }
  return head + '<br>' + why + '<br><span class="tr">趨勢：'+TREND[k]+'</span>';
}
$('nextBtn').onclick = nextRound;
$('quitBtn').onclick = function(){ finish(); };
$('startBtn').onclick = startGame;

/* ===== 結果 ===== */
function finish(){
  const a = G.A.length, b = G.B.length;
  const w = a > b ? 'A' : b > a ? 'B' : null;
  let title;
  if(!w) title = '平手！';
  else if(store.mode==='cpu') title = w==='A' ? '你贏了！' : '電腦贏了，再挑戰一次！';
  else title = esc(nameOf(w))+' 獲勝！';
  const usedTop = Object.keys(G.used).sort(function(x,y){ return G.used[y]-G.used[x]; }).slice(0,3);
  $('resultBox').innerHTML = '<h2>'+title+'</h2>'
    + '<div class="line">'+esc(nameOf('A'))+' '+a+' 張　：　'+esc(nameOf('B'))+' '+b+' 張</div>'
    + '<div class="line" style="opacity:.75; font-size:15px; margin-top:4px">共 '+G.round+' 回合'+(G.pot.length ? '，中間還有 '+G.pot.length+' 張' : '')+'</div>'
    + '<div class="learn"><h4>這場比賽用到的趨勢</h4>'+(usedTop.length ? usedTop.map(function(k){ const st = STATS.filter(function(s){ return s.k===k; })[0]; return '<b>'+st.n+'</b>：'+TREND[k]; }).join('<br>') : '還沒比任何項目喔！')+'</div>'
    + '<div class="r-btns"><button class="btn" id="againBtn">再玩一次</button><button class="btn ghost" id="homeBtn">回首頁</button></div>';
  $('againBtn').onclick = startGame;
  $('homeBtn').onclick = function(){ renderHome(); show('home'); };
  show('result');
  if(w==='A' || store.mode==='pvp') tone([523,659,784,1047], 0.12, 'triangle');
}
renderHome();
</script>
